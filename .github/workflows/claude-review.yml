# Reusable Claude PR review. Callers copy templates/claude-review.caller.yml.
# Claude runs read-only (no write tools, read-only token) and returns the review as structured
# output; a separate job with pull-requests: write keeps one marked comment on the PR up to date.
# workflow_dispatch reviews any PR into the run summary instead of commenting.
# Advisory only: never make this a required check.
name: Claude review (reusable)

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-haiku-5-5
      deep-model:
        description: Used when the PR has the review:deep label
        type: string
        default: claude-opus-5-5
      max-turns:
        type: number
        default: 40
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

env:
  PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
  MARKER: "<!-- claude-pr-review -->"

jobs:
  review:
    # PR events: skip drafts, forks (no secrets) and Dependabot; `labeled` only matters for review:deep.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       (github.event.action != 'labeled' || github.event.label.name == 'review:deep'))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      review: ${{ fromJSON(steps.claude.outputs.structured_output).review }}
      sha: ${{ steps.since.outputs.sha }}
    env:
      MODEL: ${{ contains(github.event.pull_request.labels.*.name, 'review:deep') && inputs.deep-model || inputs.model }}
    steps:
      # The action restores .claude/ and CLAUDE.md from the base branch on PR events, not on dispatch,
      # so a dispatch must not check out a fork's config next to the secrets.
      - name: Refuse fork PRs on dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: test "$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ env.PR }}/head
          persist-credentials: false
      # Later rounds: the diff since the commit the last review covered, so the skill limits suggestions
      # and nits to new code. No previous review, same commit or a failed compare means a full review.
      - id: since
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIFF: .claude-review/new-commits.diff
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          rm -rf .claude-review && mkdir .claude-review
          [ "$GITHUB_EVENT_NAME" = pull_request ] || exit 0
          # Only our own comment: anyone can post a comment that starts with the marker.
          last=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .body" |
            sed -n 's/^<!-- reviewed: \([0-9a-f]\{40\}\) -->$/\1/p' | tail -n 1) || last=""
          if [ -n "$last" ] && [ "$last" != "$head" ]; then
            # shortcut: after a force-push the compare can fail (full review) or include extra commits.
            gh api "repos/$GH_REPO/compare/$last...$head" -H "Accept: application/vnd.github.diff" > "$DIFF" || rm -f "$DIFF"
          fi
      - id: claude
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # shortcut: always agent-kit's default branch (the action takes no ref), so callers pinned to
          # a tag still get the latest skill. Fine for one maintainer; see README "Version skew".
          plugin_marketplaces: https://github.com/Bryan-Rose/agent-kit.git
          plugins: pr-review@agent-kit
          prompt: /pr-review:review-pr ${{ github.repository }}#${{ env.PR }}
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"]}'
      - name: Write the review to the run summary
        env:
          REVIEW: ${{ fromJSON(steps.claude.outputs.structured_output).review }}
        run: |
          printf '_Model: %s_\n\n%s\n' "$MODEL" "$REVIEW" >> "$GITHUB_STEP_SUMMARY"

  comment:
    needs: review
    if: github.event_name == 'pull_request'
    concurrency:
      group: claude-review-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW: ${{ needs.review.outputs.review }}
          SHA: ${{ needs.review.outputs.sha }}
        run: |
          body=$(printf '%s\n<!-- reviewed: %s -->\n%s' "$MARKER" "$SHA" "$REVIEW")
          # Only our own comment: anyone can post a comment that starts with the marker.
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
